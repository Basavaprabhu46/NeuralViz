<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTH Neural Network Visualizer</title>
<style>
:root{--bg:#fafaf7;--panel:#fff;--fg:#1c1c1a;--muted:#6b6b66;--line:#dcdcd4;--pos:#2563eb;--neg:#dc2626;--acc:#d97706}

:root[data-theme="dark"]{--bg:#121214;--panel:#1b1b1f;--fg:#ececea;--muted:#9a9a94;--line:#2e2e34;--pos:#5b9dff;--neg:#ff6b6b;--acc:#fbbf24}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;font:14px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:15px;margin:0}label.btn,button{background:var(--fg);color:var(--bg);border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
button.s{background:transparent;color:var(--fg);border:1px solid var(--line)}input[type=file]{display:none}
.ctl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.ctl input{width:110px}
main{flex:1;display:flex;min-height:0}#wrap{flex:1;position:relative;min-width:0}canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);pointer-events:none;padding:20px}
aside{width:300px;overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:12px}
h3{font-size:14px;margin:0 0 4px}h4{margin:12px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mu{color:var(--muted);font-size:12px}.r{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:2px 0;border-bottom:1px dashed var(--line)}
.p{color:var(--pos)}.n{color:var(--neg)}code{font-size:11px;word-break:break-all}#st{font-size:12px;color:var(--muted)}
@media(max-width:760px){main{flex-direction:column}aside{width:auto;height:40%;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<header><h1>PTH Network Visualizer</h1>
<label class="btn">Open .pth / .pt<input id="f" type="file" accept=".pth,.pt,.bin,.ckpt"></label><button class="s" id="demo">Load demo</button><button class="s" id="fit">Fit view</button>
<span class="ctl">Neurons/layer <input id="cap" type="range" min="4" max="96" value="24"><b id="capv">24</b></span>
<span class="ctl">Strongest weights <input id="pct" type="range" min="2" max="100" value="60"><b id="pctv">60%</b></span>
<span class="ctl">Input <input id="inp" type="text" placeholder="comma-separated, blank = random" style="width:200px"></span>
<span class="ctl">Activation <select id="actf"><option value="relu">ReLU</option><option value="tanh">tanh</option><option value="sigmoid">sigmoid</option><option value="none">none</option></select></span>
<button class="s" id="run">Run ▸</button><button class="s" id="clearRun">Clear</button>
<span id="st">Drop a PyTorch checkpoint anywhere on the page.</span></header>
<main><div id="wrap"><canvas id="cv"></canvas><div id="empty">Drop a .pth file here<br>(torch.save of a state_dict, PyTorch ≥ 1.6)<br>or click “Load demo”.</div></div>
<aside><div id="info"></div><h4>Run I/O</h4><div id="io" class="mu">—</div><h4>Tensors</h4><div id="list" class="mu">—</div></aside></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GX=280,GY=30;let M=null,S={cols:[],all:[],edges:[],max:1,view:{x:0,y:0,k:1},hover:null,pin:null,

/* ---------- graph model ---------- */

function setSD(sd,label){M=buildModel(sd);if(!M.length){status('No weight matrices (2D+ tensors) found.');return}
 $('empty').style.display='none';S.pin=S.hover=null;S.act=null;S.maxAct=null;S.litUpTo=-1;S.animLayer=null;const io0=$('io');if(io0)io0.innerHTML='—';

 $('pct').value=ne<=60000?100:30;$('pctv').textContent=$('pct').value+'%';
 $('list').innerHTML=[...sd].filter(([k,v])=>v&&v.size).map(([k,v])=>{let s='';if(v.data){let mn=1/0,mx=-1/0,sm=0;for(const x of v.data){if(x<mn)mn=x;if(x>mx)mx=x;sm+=x}s=`min ${mn.toFixed(3)} · max ${mx.toFixed(3)} · mean ${(sm/v.data.length).toFixed(3)}`}

/* ---------- forward pass ---------- */
const ACT={relu:x=>Math.max(0,x),tanh:Math.tanh,sigmoid:x=>1/(1+Math.exp(-x)),none:x=>x};
